name: Follow HEAD

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "unpinned: manifests without commit_sha; all: every manifest in the repository"
        type: choice
        options:
          - unpinned
          - all
        default: unpinned

env:
  QU_CATALOG_URL: ${{ vars.QU_CATALOG_URL }}

jobs:
  list-unpinned:
    name: List manifests
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.list.outputs.batches }}
      configured: ${{ steps.server.outputs.configured }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python requirements
        run: python3 -m pip install pyyaml

      - name: List
        id: list
        run: |
          if [ "${{ inputs.scope }}" = "all" ] ; then
            echo batches=$( python3 tools/publish.py list --batch 50 ) >> $GITHUB_OUTPUT ;
          else
            echo batches=$( python3 tools/publish.py list --unpinned --batch 50 ) >> $GITHUB_OUTPUT ;
          fi

      - name: Check server settings
        id: server
        env:
          HAS_URL: ${{ vars.QU_CATALOG_URL != '' }}
          HAS_TOKEN: ${{ secrets.QU_CI_TOKEN != '' }}
        run: |
          if [ "$HAS_URL" = "true" ] && [ "$HAS_TOKEN" = "true" ] ; then
            echo configured=true >> $GITHUB_OUTPUT ;
          else
            echo configured=false >> $GITHUB_OUTPUT ;
            echo "::warning::QU_CATALOG_URL variable or QU_CI_TOKEN secret is not set, nothing is submitted" ;
          fi

  submit:
    name: Submit
    needs: list-unpinned
    if: needs.list-unpinned.outputs.batches != '[]' && needs.list-unpinned.outputs.configured == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifests: ${{ fromJson(needs.list-unpinned.outputs.batches) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Python requirements
        run: python3 -m pip install pyyaml

      - name: Submit manifests
        env:
          QU_CI_TOKEN: ${{ secrets.QU_CI_TOKEN }}
          MANIFESTS: ${{ toJson(matrix.manifests) }}
        run: |
          mapfile -t list < <( jq -r '.[]' <<< "$MANIFESTS" ) ;
          python3 tools/publish.py publish "${list[@]}"
