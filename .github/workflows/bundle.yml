name: Process manifests

on:
  push:
    branches:
      - main
  pull_request:

env:
  QU_CATALOG_URL: ${{ vars.QU_CATALOG_URL }}

jobs:
  process-manifests:
    name: Get changes
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.changes.outputs.batches }}
      deleted: ${{ steps.changes.outputs.deleted }}
      checks-only: ${{ steps.changes.outputs.checks-only }}
      configured: ${{ steps.server.outputs.configured }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python requirements
        run: python3 -m pip install pyyaml

      - name: Get updated manifests
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] ; then
            BASE=${{ github.event.pull_request.base.sha }} ;
            BATCH=10 ;
            echo checks-only=true >> $GITHUB_OUTPUT ;
          else
            BASE=${{ github.event.before }} ;
            BATCH=50 ;
            echo checks-only=false >> $GITHUB_OUTPUT ;
          fi ;
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null ; then
            BASE=$( git hash-object -t tree /dev/null ) ;
          fi ;
          python3 tools/publish.py changed --batch "$BATCH" "$BASE" "${{ github.sha }}" > changes.json ;
          echo batches=$( jq -c '.batches' changes.json ) >> $GITHUB_OUTPUT ;
          echo deleted=$( jq -c '.deleted' changes.json ) >> $GITHUB_OUTPUT ;
          jq -r '.changed[]' changes.json > changed.txt ;
          echo "BASE=$BASE" >> $GITHUB_ENV ;

      - name: Check server settings
        id: server
        env:
          HAS_URL: ${{ vars.QU_CATALOG_URL != '' }}
          HAS_TOKEN: ${{ secrets.QU_CI_TOKEN != '' }}
        run: |
          if [ "$HAS_URL" = "true" ] && [ "$HAS_TOKEN" = "true" ] ; then
            echo configured=true >> $GITHUB_OUTPUT ;
          else
            echo configured=false >> $GITHUB_OUTPUT ;
            if [ "${{ github.event_name }}" = "push" ] ; then
              echo "::warning::QU_CATALOG_URL variable or QU_CI_TOKEN secret is not set, nothing is submitted" ;
            fi ;
          fi

      - name: Generate diff comment data
        id: diff-comment
        if: github.event_name == 'pull_request'
        run: |
          [ -s changed.txt ] || exit 0 ;
          echo "### Catalog updates" >> diff.md ;
          while read -r manifest ; do
            SHA_DIFF=$( git diff --unified=0 "$BASE" ${{ github.sha }} -- "$manifest" | grep "commit_sha: " ) ;
            OLD_SHA_VALUE=$( echo "$SHA_DIFF" | grep -E '^\-' | sed "s/.*: //" | xargs ) ;
            NEW_SHA_VALUE=$( echo "$SHA_DIFF" | grep -E '^\+' | sed "s/.*: //" | xargs ) ;
            REPO_URL=$( grep " origin: " "$manifest" | sed "s/.*origin: \(.*\)/\1/" | sed "s/\(.*\).git$/\1/" ) ;
            ENTRY_ID=$( basename $( dirname "$manifest" ) ) ;
            if ! grep -q "commit_sha:" "$manifest" ; then
              echo "\`$ENTRY_ID\` follows HEAD: [repo]($REPO_URL) :warning: trusted repositories only" >> diff.md ;
            elif [ "z$OLD_SHA_VALUE" == "z" ] ; then
              echo "New \`$ENTRY_ID\`: [repo]($REPO_URL/tree/$NEW_SHA_VALUE)" >> diff.md ;
            else
              echo "Updated \`$ENTRY_ID\`: [changes]($REPO_URL/compare/$OLD_SHA_VALUE...$NEW_SHA_VALUE)" >> diff.md ;
            fi ;
          done < changed.txt ;
          echo 'repo-diff-md-file=diff.md' >> $GITHUB_OUTPUT ;
          echo 'repo-diff<<REPO-DIFF-DATA-EOF' >> $GITHUB_OUTPUT ;
          cat diff.md >> $GITHUB_OUTPUT ;
          echo 'REPO-DIFF-DATA-EOF' >> $GITHUB_OUTPUT ;

      - name: Output diff to job status
        if: steps.diff-comment.outputs.repo-diff != ''
        run: |
          cat "${{ steps.diff-comment.outputs.repo-diff-md-file }}" >> $GITHUB_STEP_SUMMARY ;

      - name: Find diff comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        if: steps.diff-comment.outputs.repo-diff != '' && !github.event.pull_request.head.repo.fork
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '### Catalog updates'

      - name: Create or update diff comment
        if: steps.diff-comment.outputs.repo-diff != '' && !github.event.pull_request.head.repo.fork
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body: ${{ steps.diff-comment.outputs.repo-diff }}
          edit-mode: replace


  build-package:
    name: Build package
    needs: process-manifests
    if: needs.process-manifests.outputs.batches != '[]' && (needs.process-manifests.outputs.checks-only == 'true' || needs.process-manifests.outputs.configured == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifests: ${{ fromJson(needs.process-manifests.outputs.batches) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Python requirements
        if: needs.process-manifests.outputs.checks-only == 'true'
        run: python3 -m pip install -r tools/requirements.txt

      - name: Setup publish requirements
        if: needs.process-manifests.outputs.checks-only != 'true'
        run: python3 -m pip install pyyaml

      - name: Setup ufbt
        if: needs.process-manifests.outputs.checks-only == 'true'
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          task: setup
          skip-setup: true

      - name: Check manifests
        if: needs.process-manifests.outputs.checks-only == 'true'
        env:
          MANIFESTS: ${{ toJson(matrix.manifests) }}
        run: |
          echo "::add-matcher::${{ github.workspace }}/.github/problem-matcher.json" ;
          mapfile -t list < <( jq -r '.[]' <<< "$MANIFESTS" ) ;
          .github/scripts/process.sh check "${list[@]}"

      - name: Submit manifests
        if: needs.process-manifests.outputs.checks-only != 'true'
        env:
          QU_CI_TOKEN: ${{ secrets.QU_CI_TOKEN }}
          MANIFESTS: ${{ toJson(matrix.manifests) }}
        run: |
          mapfile -t list < <( jq -r '.[]' <<< "$MANIFESTS" ) ;
          python3 tools/publish.py publish "${list[@]}"


  delete-entries:
    name: Delete entries
    needs: process-manifests
    if: needs.process-manifests.outputs.deleted != '[]' && needs.process-manifests.outputs.checks-only != 'true' && needs.process-manifests.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python requirements
        run: python3 -m pip install pyyaml

      - name: Hide deleted entries on the server
        env:
          QU_CI_TOKEN: ${{ secrets.QU_CI_TOKEN }}
          DELETED: ${{ needs.process-manifests.outputs.deleted }}
        run: |
          mapfile -t list < <( jq -r '.[]' <<< "$DELETED" ) ;
          python3 tools/publish.py delete "${list[@]}"


  self-test:
    name: Run self-test
    needs: process-manifests
    if: github.event_name == 'pull_request' && needs.process-manifests.outputs.deleted == '[]' && needs.process-manifests.outputs.batches == '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run self-test
        id: self-test
        uses: ./.github/actions/bundle
        with:
          path: example/manifest.yml

      - name: Create bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: "test-bundle"
          path: ${{ steps.self-test.outputs.bundle-path }}


  report-status:
    name: Report status
    needs: [ self-test, build-package, delete-entries ]
    if: always() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - run: echo "All good ✨" ;
