id: sub_dup_finder
author: Endika
short_description: A Flipper Zero application to identify, manage, and safely clean up duplicate Sub-GHz (.sub) files.
description: 'Sub Duplicate Finder is an optimized Flipper Zero application designed to reclaim storage space by managing duplicate Sub-GHz (.sub) files. Providing a safe and intuitive interface to group, review, and delete redundant signals directly from your device. It ensures stability and performance for your Sub-GHz storage management.

  '
changelog: '- 1.3.0: Choose which folder to scan, and the app remembers it. Unreadable or truncated files are no longer offered for deletion.

  - Automated releases with release-please and FAP upload

  - Refactored codebase into separate modules (SRP, DIP)

  - Auto-versioned credits screen

  '
