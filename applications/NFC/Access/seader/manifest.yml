id: seader
category: NFC/Access
short_description: Allows for reading credential from HID iClass, iClass SE, Desfire EV1/EV2, and Seos
description: "Allows for reading credential from HID iClass, iClass SE, MFC SE, Desfire EV1/EV2, and Seos. Credentials can be saved in an agnostic format, or as various Flipper formats (Prox, MFC, iClass, iClass SR), depending on the original type.\nRequires addon: UART to mini-SIM adapter and HID SAM. \nSee full readme for wiring and more information: https://github.com/bettse/seader/blob/main/readme.md\n"
