# The category tree of every family, sent whole to every catalog server
# before the bundles. A folder under applications/, menustyles/ or
# animations/ is one of these names, and a manifest in a folder not declared
# here does not pass the check. Order is priority. Application roots keep the
# official catalog's ids, so the app's bundled icons keep matching; a child
# takes its parent's color unless it names one.
application:
  - id: 64971d0f6617ba37a4bc79b3
    name: Sub-GHz
    color: A5F4BE
    icon: subghz
    children:
